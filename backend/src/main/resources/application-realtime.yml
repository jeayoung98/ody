# Realtime 설정 — 하트비트/TTL/Sweep, 격자·임계, 축별 정규화 min/max.
# 활성화: spring.profiles.active 에 realtime 추가. RealtimeProperties 로 주입(RealtimeConfig).
# 계약: specs/004-realtime-presence-nearby/plan.md §설정, data-model.md §1.
realtime:
  presence:
    heartbeat-interval-ms: 15000
    ttl-ms: 45000
    sweep-interval-ms: 5000
    recount-interval-ms: 60000
  nearby:
    neighbor-k: 10
  viewport:
    grid-size: 16                  # ★ cluster-threshold-cells 와 세트로만 변경
    cluster-threshold-cells: 36
    marker-cap: 64
    debounce-ms: 250
    cell-counts-interval-ms: 5000
  # 축별 전역 정규화 min/max — 실측값(6,624,399곡, music.location p01/p99, 2026-09).
  #  raw min/max 는 아웃라이어로 격자 붕괴 → p01/p99 경계 + 바깥은 edge 셀 clamp(Normalizer).
  #  분산 감소로 축마다 스케일 다름(PC1 std 6.36 → PC16 1.55) → 공용 범위 금지.
  axis-range:
    - { axis: 1 , min:  -13.63, max:  14.36 }
    - { axis: 2 , min:  -10.25, max:  20.47 }
    - { axis: 3 , min:   -8.75, max:  10.52 }
    - { axis: 4 , min:   -7.45, max:  10.16 }
    - { axis: 5 , min:   -7.74, max:  11.52 }
    - { axis: 6 , min:   -6.27, max:  12.19 }
    - { axis: 7 , min:   -7.03, max:   6.07 }
    - { axis: 8 , min:   -3.88, max:   6.13 }
    - { axis: 9 , min:   -4.60, max:   7.40 }
    - { axis: 10, min:   -4.44, max:   6.27 }
    - { axis: 11, min:   -5.46, max:   4.18 }
    - { axis: 12, min:   -4.23, max:   4.97 }
    - { axis: 13, min:   -4.07, max:   4.54 }
    - { axis: 14, min:   -4.39, max:   4.86 }
    - { axis: 15, min:   -4.29, max:   4.60 }
    - { axis: 16, min:   -3.89, max:   4.16 }
