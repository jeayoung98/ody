server:
  port: 8080
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: false
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        ody.journey.engine: true
        # 20명 선단으로 주변곡 탭을 열 때 p99 와 커넥션 풀 대기를 재려면 분포가 있어야 한다.
        ody.nearby.candidates: true
        hikaricp.connections.acquire: true
      # 스크랩 한 번으로 p99 를 바로 읽으려면 분위수도 같이 내보내야 한다.
      percentiles:
        ody.nearby.candidates: 0.5, 0.95, 0.99
        hikaricp.connections.acquire: 0.5, 0.95, 0.99

# 좌표계 버전에 귀속된 후처리 임계값 (FR-024).
# 값의 유일한 출처는 data/serving/<bundle>/postprocess_rules.json 이다 — 여기 적은 값은 그 사본이고,
# 번들을 바꾸면 이 블록도 같이 바꾼다. 코드에 상수로 박지 않는다.
# 여정(004)과 주변 탐색(005)이 같은 블록을 읽는다.
ody:
  videoid:
    # 개인 EC2 배포 videoid_api.py (S15P21A405-312, 프로토타입). 실제 주소로 덮어써야 한다.
    base-url: ${VIDEOID_API_BASE_URL}
  profile-image:
    # 업로드 파일이 실제로 쌓이는 디렉터리. 배포에서는 호스트 디렉터리를 컨테이너에 같은 경로로
    # 마운트한다(backend/deploy.sh). Blue-Green 두 슬롯이 같은 디렉터리를 본다.
    dir: ${PROFILE_IMAGE_DIR}
    # 저장된 파일의 공개 주소 접두. DB image_url 에 이 값 + / + 파일명이 절대 URL 로 들어간다.
    # nginx 가 직접 서빙하게 되면 이 값만 바꾸면 된다 (S15P21A405-426).
    base-url: ${PROFILE_IMAGE_BASE_URL}
  serving:
    bundle: v2.1-pca16
    tau-dup: 1.6624            # 미만은 같은 녹음으로 접는다
    artist-cap: 3              # 결과 안 같은 아티스트 최대 곡 수
    tau-far: 4.912             # 마지막 이웃 거리가 넘으면 '유사도 낮음' (005)
    length-min-s: 30
    length-max-s: 1200
    far-endpoint-dist: 10.7    # 끝점 거리가 넘으면 먼 여정 (D3, 004)
  taste:
    reference-resource: ${TASTE_REFERENCE_RESOURCE:classpath:taste/taste-reference-v1.json}
    zone: ${TASTE_ANALYSIS_ZONE:Asia/Seoul}
    gms:
      base-url: ${GMS_BASE_URL:https://gms.ssafy.io/gmsapi/api.openai.com/v1}
      key: ${GMS_KEY:}
      model: ${GMS_MODEL:gpt-4.1}
      connect-timeout-ms: ${GMS_CONNECT_TIMEOUT_MS:2000}
      read-timeout-ms: ${GMS_READ_TIMEOUT_MS:25000}

spring:
  datasource:
    # prepareThreshold=0: 서버사이드 prepared statement(제네릭 플랜)로 전환하지 않는다.
    # 기본값(5회 후 전환)에서는 Postgres 가 LIKE prefix 값을 모른 채 플랜을 세워 인덱스 range
    # 스캔으로 좁히지 못하고, music 검색(MusicSearchMapper.findPage)이 간헐적으로 2초 타임아웃에
    # 걸렸다(S15P21A405-304). 색인(music_title_lower/artist_lower)은 valid 상태였다.
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?prepareThreshold=0
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
  neo4j:
    uri: bolt://${NEO4J_HOST}:${NEO4J_PORT}
    authentication:
      username: neo4j
      password: ${NEO4J_PASSWORD}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: email, profile
  servlet:
    # 업로드는 프로필 이미지뿐이다. ProfileImageStorage.MAX_BYTES 와 같은 값을 유지한다 [S15P21A405-426].
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

# 배포 nginx 는 /api/ 만 백엔드로 프록시하므로 문서 경로도 /api 하위로 둔다.
springdoc:
  api-docs:
    path: /api/v3/api-docs
  swagger-ui:
    path: /api/swagger-ui.html

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration-ms: 1800000
    refresh-token-expiration-ms: 1209600000
  oauth:
    frontend-redirect-uri: ${FRONTEND_OAUTH_REDIRECT_URI}

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  data:
    redis:
      host: localhost
      port: 6379
      password:
  neo4j:
    uri: bolt://localhost:7687
    authentication:
      username: neo4j
      password: test
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-client-id
            client-secret: test-client-secret

ody:
  videoid:
    # 테스트는 컨텍스트 로딩만 하고 실제로 호출하지 않는다 — 값은 플레이스홀더가
    # 풀리기만 하면 된다(S15P21A405-317).
    base-url: http://localhost:8001
  profile-image:
    dir: ${java.io.tmpdir}/ody-profile-images-test
    base-url: http://localhost:8080/api/user/images

app:
  cors:
    allowed-origins: "*"
  jwt:
    secret: test-jwt-secret-key-for-unit-tests-only-do-not-use-in-production
    access-token-expiration-ms: 1800000
    refresh-token-expiration-ms: 1209600000
  oauth:
    frontend-redirect-uri: http://localhost:5173/oauth/redirect
