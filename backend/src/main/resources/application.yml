server:
  port: 8080
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: false
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
  neo4j:
    uri: bolt://${NEO4J_HOST}:${NEO4J_PORT}
    authentication:
      username: neo4j
      password: ${NEO4J_PASSWORD}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: email, profile

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration-ms: 1800000
    refresh-token-expiration-ms: 1209600000
  oauth:
    frontend-redirect-uri: ${FRONTEND_OAUTH_REDIRECT_URI}

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  data:
    redis:
      host: localhost
      port: 6379
      password:
  neo4j:
    uri: bolt://localhost:7687
    authentication:
      username: neo4j
      password: test
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-client-id
            client-secret: test-client-secret

app:
  cors:
    allowed-origins: "*"
  jwt:
    secret: test-jwt-secret-key-for-unit-tests-only-do-not-use-in-production
    access-token-expiration-ms: 1800000
    refresh-token-expiration-ms: 1209600000
  oauth:
    frontend-redirect-uri: http://localhost:5173/oauth/redirect
