server:
  port: 8080
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: false
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        ody.journey.engine: true

# 경로 탐색 (정본 §3.3). 산출은 BE4 데이터 엔진(Python FastAPI)이 하고 백엔드는 게이트웨이다(D4).
# timeout 은 종단 3초 예산(요구사항 §6)에서 역산한 값이다 — 엔진 실측 p95 1.541s.
# 재시도는 두지 않는다: 1회만 재시도해도 최악 4초로 예산을 넘긴다.
# base-url 실제 값은 환경별 application-*.yml / 환경변수로 주입한다. 여기에 운영 호스트를 적지 않는다.
ody:
  journey:
    engine:
      base-url: ${JOURNEY_ENGINE_URL:}
      timeout: 2s

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
  neo4j:
    uri: bolt://${NEO4J_HOST}:${NEO4J_PORT}
    authentication:
      username: neo4j
      password: ${NEO4J_PASSWORD}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: email, profile

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration-ms: 1800000
    refresh-token-expiration-ms: 1209600000
  oauth:
    frontend-redirect-uri: ${FRONTEND_OAUTH_REDIRECT_URI}

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  data:
    redis:
      host: localhost
      port: 6379
      password:
  neo4j:
    uri: bolt://localhost:7687
    authentication:
      username: neo4j
      password: test
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-client-id
            client-secret: test-client-secret

app:
  cors:
    allowed-origins: "*"
  jwt:
    secret: test-jwt-secret-key-for-unit-tests-only-do-not-use-in-production
    access-token-expiration-ms: 1800000
    refresh-token-expiration-ms: 1209600000
  oauth:
    frontend-redirect-uri: http://localhost:5173/oauth/redirect
