# Add `root` at server scope and replace only the existing catch-all `location /`.
# Keep the existing /api/, /actuator/, TLS, Certbot, and backend upstream blocks unchanged.
root /var/www/ody/current;

location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files /index.html =503;
}

location = /healthz.txt {
    add_header Cache-Control "no-store" always;
    default_type text/plain;
    try_files /healthz.txt =503;
}

location = /build-id.txt {
    add_header Cache-Control "no-store" always;
    default_type text/plain;
    try_files /build-id.txt =503;
}

location ^~ /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}

location / {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files $uri $uri/ /index.html;
}
