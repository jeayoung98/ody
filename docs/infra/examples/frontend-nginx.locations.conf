# Add `root` at server scope and replace only the existing catch-all `location /`.
# Keep the existing /api/, /actuator/, TLS, Certbot, and backend upstream blocks unchanged.
#
# frontend/deploy.sh는 reload_nginx()에서 이 BEGIN/END 마커 사이 내용만 라이브
# /etc/nginx/sites-available/backend 에 이식한다 (splice_frontend_block()). 마커
# 바깥의 backend upstream/TLS/Certbot 블록은 절대 건드리지 않는다. 이 파일과
# /etc/nginx/sites-available/backend.next, backend.before-next 모두 동일한
# BEGIN/END 마커로 이 블록을 감싸고 있어야 한다 — 마커가 없으면 배포 스크립트는
# 라이브 설정을 임의로 바꾸는 대신 실패한다.
# BEGIN ODY-FRONTEND-LOCATIONS (managed by frontend/deploy.sh; do not edit by hand)
root /var/www/ody/current;

location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files /index.html =503;
}

location = /healthz.txt {
    add_header Cache-Control "no-store" always;
    default_type text/plain;
    try_files /healthz.txt =503;
}

location = /build-id.txt {
    add_header Cache-Control "no-store" always;
    default_type text/plain;
    try_files /build-id.txt =503;
}

location ^~ /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}

location / {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files $uri $uri/ /index.html;
}
# END ODY-FRONTEND-LOCATIONS
