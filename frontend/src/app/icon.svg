<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    ODY 파비콘 — 지도의 우주선(draw-friends.ts drawShip)과 같은 로켓. 좌표는 R=40 기준 캔버스 값을
    그대로 옮긴 것이고(코 -50, 꼬리 70, 창 중심 0), 참고 이미지처럼 40도 기울여 담았다.
    색은 서비스 팔레트: 몸통 ink(#e9f1ff) 두 톤, 창 테 ink4(#3a4761), 유리 violet(#a67cff), 지느러미 teal(#4fe3ce).
  -->
  <defs>
    <path id="body" d="M 0 -50 C 26 -50 42 -20 42 6 C 42 32 30 54 18 60 L -18 60 C -30 54 -42 32 -42 6 C -42 -20 -26 -50 0 -50 Z"/>
    <clipPath id="bodyClip"><use href="#body"/></clipPath>
  </defs>
  <g transform="translate(32 32) rotate(40) scale(0.36) translate(0 -10)">
    <!-- 지느러미 -->
    <path d="M -30 22 C -50 34 -58 50 -56 62 C -50 64 -36 60 -26 56 Z" fill="#4fe3ce"/>
    <path d="M 30 22 C 50 34 58 50 56 62 C 50 64 36 60 26 56 Z" fill="#4fe3ce"/>
    <!-- 몸통 두 톤 -->
    <use href="#body" fill="#e9f1ff"/>
    <rect x="0" y="-56" width="60" height="130" fill="#cfd9f7" clip-path="url(#bodyClip)"/>
    <!-- 꼬리 밴드 -->
    <path d="M -18 60 L 18 60 C 18 66 10 70 0 70 C -10 70 -18 66 -18 60 Z" fill="#3a4761"/>
    <!-- 창 -->
    <circle cx="0" cy="0" r="33.6" fill="#3a4761"/>
    <circle cx="0" cy="0" r="28.8" fill="#a67cff"/>
    <circle cx="-9" cy="-9" r="6.4" fill="#ffffff" fill-opacity="0.35"/>
  </g>
</svg>
