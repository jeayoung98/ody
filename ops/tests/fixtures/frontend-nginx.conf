events {}

http {
    upstream backend {
        server 127.0.0.1:8081;
    }

    server {
        listen 8080;
        server_name j15a405.p.ssafy.io;

        location /api/ {
            proxy_pass http://backend;
        }

        location /actuator/ {
            deny all;
        }

        include /etc/nginx/snippets/frontend-nginx.locations.conf;
    }
}
